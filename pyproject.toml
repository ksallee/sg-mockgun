[project]
name = "sg-mockgun"
version = "0.1.0"
description = "Mockgun, the in-memory Flow Production Tracking mock from shotgun_api3, extended with behaviour recorded by sg-groundtruth."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["shotgun-api3>=3.10.5"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_mockgun"]
