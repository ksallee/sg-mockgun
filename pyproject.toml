[project]
name = "sg-mockgun"
version = "1.0.0"
description = "An in-memory Flow Production Tracking mock that replaces shotgun_api3's mockgun and answers as a live site answers over api3."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["shotgun-api3>=3.10.5"]
keywords = ["shotgun", "shotgrid", "flow production tracking", "mockgun", "testing", "mock"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing :: Mocking",
]

[project.urls]
Homepage = "https://sg-mockgun.vercel.app"
Repository = "https://github.com/ksallee/sg-mockgun"
Changelog = "https://github.com/ksallee/sg-mockgun/blob/main/CHANGELOG.md"
Issues = "https://github.com/ksallee/sg-mockgun/issues"

[project.scripts]
sg-mockgun = "sg_mockgun.server:main"

[project.entry-points.pytest11]
sg_mockgun = "sg_mockgun.pytest_plugin"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_mockgun"]

[tool.hatch.build.targets.sdist]
exclude = ["site"]
