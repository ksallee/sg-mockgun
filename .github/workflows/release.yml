# Publish to PyPI when a GitHub release is published. Nothing else triggers it: a tag alone does not,
# so a mistyped tag costs nothing and the release notes are written before anything ships.
#
# No token anywhere. PyPI Trusted Publishing exchanges this workflow's OIDC identity for a short-lived
# upload token, which is why `id-token: write` is here and no secret is. It has to be configured once
# on PyPI, under the project's Publishing settings (a pending publisher before the first release):
#
#   owner              ksallee
#   repository         sg-mockgun
#   workflow           release.yml
#   environment        pypi
#
# The `pypi` environment is the second half of that: with it set, only a run in that environment can
# claim the identity, so a workflow added by a pull request cannot publish.
#
# The version published is `[project].version` in pyproject.toml. PyPI refuses a version it already
# has, so bump it in the same commit as the release, and never re-point a tag at new code.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Built from the tagged tree, because that is the tree being published.
      - run: uv build

      # The schemas are pickles inside the package: a wheel that lost them still imports, so this
      # loads both and writes a record before anyone can install it.
      - name: The wheel works before anyone can install it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip -q install dist/*.whl
          /tmp/v/bin/sg-mockgun --help > /dev/null
          cd /tmp && /tmp/v/bin/python -c "
          from sg_mockgun import Shotgun, schemas
          for name in (None, 'upstream_3_10_5'):
              Shotgun.set_schema_paths(*(schemas.paths(name) if name else schemas.paths()))
              sg = Shotgun('https://mock.example.com', script_name='x', api_key='y')
              assert sg.create('Project', {'name': 'x'})['id'] == 1, name
          print('ok')
          "

      - uses: pypa/gh-action-pypi-publish@release/v1
